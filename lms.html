<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T-FIT LAB • Lớp học (LMS)</title><link rel="icon" href="assets/favicon.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>.b{padding:.4rem .8rem;border-radius:.6rem;font-weight:700;font-size:.8rem;background:#5C0A14;color:#FACC15}.b2{background:#e2e8f0;color:#0f172a}.b:disabled{opacity:.5}
.i{border:1px solid #cbd5e1;border-radius:.5rem;padding:.4rem .6rem;width:100%;font-size:.85rem}.card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1rem}</style></head>
<body class="bg-slate-50 text-slate-900 text-sm">
<header class="bg-[#5C0A14] text-white sticky top-0 z-10"><div class="max-w-6xl mx-auto px-4 py-2 flex items-center gap-3 flex-wrap">
<a href="index.html" class="flex items-center gap-2"><img src="assets/logo.png" class="h-9" alt="logo"><b>T-FIT LAB • Lớp học</b></a>
<nav id="nav" class="flex gap-2 flex-1 flex-wrap"></nav><div id="who" class="text-xs"></div></div></header>
<main id="app" class="max-w-6xl mx-auto p-4 space-y-4"></main><div id="toast" class="fixed bottom-4 right-4 px-4 py-2 rounded-xl text-white hidden"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let T=localStorage.getItem('tfit_token'), U=null, V={v:'home'};
const toast=(m,ok=true)=>{const t=$('#toast');t.textContent=m;t.className='fixed bottom-4 right-4 px-4 py-2 rounded-xl text-white '+(ok?'bg-emerald-700':'bg-rose-700');setTimeout(()=>t.classList.add('hidden'),3500)};
async function api(m,p,b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(T?{Authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined});
 const d=await r.json().catch(()=>({}));if(r.status===401&&T){logout(true)}if(!r.ok)throw new Error(d.error||'Lỗi '+r.status);return d}
const act=async(fn,okMsg)=>{try{const r=await fn();if(okMsg)toast(okMsg);return r}catch(e){toast(e.message,false)}};
const fd=f=>Object.fromEntries(new FormData(f));
const loading=()=>$('#app').innerHTML='<p class="text-slate-500">Đang tải…</p>';
const empty=t=>`<p class="text-slate-500 italic">${t}</p>`;
function logout(x){localStorage.removeItem('tfit_token');T=U=null;boot();if(!x)toast('Đã đăng xuất')}
const dt=s=>s?new Date(s).toLocaleString('vi-VN'):'Không hạn';

function loginView(){ $('#nav').innerHTML='';$('#who').innerHTML='';
 $('#app').innerHTML=`<div class="max-w-md mx-auto card space-y-3"><h2 class="font-bold text-lg">Đăng nhập</h2>
 <div class="grid grid-cols-3 gap-2">${[['Admin','admin@dntu.edu.vn'],['Giảng viên','an.nv@dntu.edu.vn'],['Sinh viên','khoa.lm@dntu.edu.vn']].map(([n,e])=>`<button class="b" onclick="document.f.identifier.value='${e}';document.f.password.value='123456'">${n}</button>`).join('')}</div>
 <form name="f" class="space-y-2"><input name="identifier" class="i" placeholder="Email hoặc MSSV/Mã GV" required><input name="password" type="password" class="i" placeholder="Mật khẩu" required><button class="b w-full">Đăng nhập</button></form>
 <details><summary class="cursor-pointer text-xs underline">Đăng ký sinh viên</summary><form name="r" class="space-y-2 mt-2"><input name="code" class="i" placeholder="MSSV" required><input name="name" class="i" placeholder="Họ tên" required><input name="email" type="email" class="i" placeholder="Email" required><input name="password" type="password" minlength="6" class="i" placeholder="Mật khẩu ≥ 6 ký tự" required><button class="b w-full">Đăng ký</button></form></details></div>`;
 document.f.onsubmit=e=>{e.preventDefault();act(async()=>{const d=await api('POST','/auth/login',fd(e.target));T=d.token;localStorage.setItem('tfit_token',T);boot()})};
 document.r.onsubmit=e=>{e.preventDefault();act(async()=>{await api('POST','/auth/register',fd(e.target));e.target.reset()},'Đăng ký thành công, hãy đăng nhập')};}

function chrome(){const r=U.role;const items=[['home','Tổng quan'],['classes','Lớp học'],...(r==='ADMIN'?[['admin','Quản trị']]:[]),['notif','Thông báo']];
 $('#nav').innerHTML=items.map(([k,l])=>`<button class="b ${V.v===k?'':'b2'}" onclick="go('${k}')">${l}</button>`).join('');
 $('#who').innerHTML=`${esc(U.name)} (${r}) <button class="underline ml-2" onclick="chpw()">Đổi MK</button> <button class="underline ml-2" onclick="logout()">Đăng xuất</button>`}
const go=(v,id)=>{V={v,id};render()};
const chpw=()=>{const o=prompt('Mật khẩu hiện tại:');if(o===null)return;const n=prompt('Mật khẩu mới (≥ 6 ký tự):');if(n===null)return;act(()=>api('POST','/me/password',{oldPassword:o,newPassword:n}),'Đã đổi mật khẩu')};

async function render(){chrome();loading();try{await({home,classes,class:classView,admin,notif}[V.v])()}catch(e){$('#app').innerHTML=`<p class="text-rose-700">Lỗi: ${esc(e.message)}</p>`}}
async function home(){const d=await api('GET','/dashboard');
 if(d.role==='STUDENT')return $('#app').innerHTML=`<div class="grid md:grid-cols-3 gap-4">
 <div class="card"><h3 class="font-bold mb-2">Lớp đã tham gia (${d.classes.length})</h3>${d.classes.map(c=>`<a href="#" onclick="go('class',${c.id});return false" class="block underline">${esc(c.name)}</a>`).join('')||empty('Chưa tham gia lớp nào')}
 <form id="jf" class="mt-3 flex gap-2"><input name="code" class="i" placeholder="Nhập mã lớp (TF-XXXXXX)" required><button class="b">Tham gia</button></form></div>
 <div class="card"><h3 class="font-bold mb-2">Bài sắp đến hạn</h3>${d.upcoming.map(a=>`<div>${esc(a.title)} <span class="text-slate-500">• ${esc(a.class)} • ${dt(a.due)}</span></div>`).join('')||empty('Không có bài nào đang chờ')}</div>
 <div class="card"><h3 class="font-bold mb-2">Điểm gần đây</h3>${d.grades.map(g=>`<div>${esc(g.title)}: <b>${g.score}/${g.max_score}</b></div>`).join('')||empty('Chưa có điểm')}<p class="mt-3">Thông báo chưa đọc: <b>${d.unread}</b></p></div></div>`,
  $('#jf').onsubmit=e=>{e.preventDefault();act(async()=>{const r=await api('POST','/classes/join',fd(e.target));toast(r.status==='PENDING'?'Đã gửi yêu cầu, chờ giảng viên duyệt':'Tham gia lớp thành công');render()})};
 $('#app').innerHTML=`<div class="grid md:grid-cols-4 gap-4">${[['Lớp',d.classes],['Sinh viên',d.students],['Chờ duyệt vào lớp',d.pending_join],['Bài chờ chấm',d.to_grade]].map(([l,n])=>`<div class="card"><div class="text-3xl font-bold">${n}</div>${l}</div>`).join('')}</div>`}
async function classes(){const cs=await api('GET','/classes'),isS=U.role==='STUDENT';
 $('#app').innerHTML=`${isS?'':`<form id="cf" class="card grid md:grid-cols-5 gap-2 items-end"><input name="name" class="i" placeholder="Tên lớp" required><input name="course" class="i" placeholder="Học phần"><input name="max_students" type="number" min="1" value="50" class="i"><label><input type="checkbox" name="approval" value="1"> Cần duyệt</label><button class="b">Tạo lớp</button></form>`}
 <div class="grid md:grid-cols-3 gap-4">${cs.map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="text-slate-500">${esc(c.course||'')} • GV: ${esc(c.lecturer||'')}</div><div>${c.students} SV • ${c.status||c.member_status}${c.code?` • Mã: <b class="font-mono">${esc(c.code)}</b>`:''}</div><button class="b mt-2" onclick="go('class',${c.id})">Mở lớp</button></div>`).join('')||empty('Chưa có lớp nào')}</div>`;
 if($('#cf'))$('#cf').onsubmit=e=>{e.preventDefault();const b=fd(e.target);act(async()=>{await api('POST','/classes',b);render()},'Đã tạo lớp')}}
async function classView(){const id=V.id,[c,an,as,mem]=await Promise.all([api('GET','/classes/'+id),api('GET',`/classes/${id}/announcements`),api('GET',`/classes/${id}/assignments`),api('GET',`/classes/${id}/members`)]);
 const staff=U.role!=='STUDENT',pend=mem.filter(m=>m.status==='PENDING');
 $('#app').innerHTML=`<button class="b b2" onclick="go('classes')">← Lớp học</button>
 <div class="card"><h2 class="font-bold text-lg">${esc(c.name)}</h2><div>${esc(c.course||'')} • ${c.status} • tối đa ${c.max_students} SV${staff?` • Mã lớp: <b class="font-mono">${esc(c.code)}</b>`:''}</div>
 ${staff?`<div class="mt-2 flex gap-2 flex-wrap"><button class="b" onclick="cp('${esc(c.code)}')">Sao chép mã</button><button class="b" onclick="cp(location.origin+'/lms.html?join=${esc(c.code)}')">Sao chép link mời</button><button class="b" onclick="patch(${id},{regenerate_code:1})">Đổi mã</button><button class="b" onclick="patch(${id},{status:'${c.status==='OPEN'?'CLOSED':'OPEN'}'})">${c.status==='OPEN'?'Đóng lớp':'Mở lớp'}</button></div>`:`<button class="b mt-2" onclick="leave(${id})">Rời lớp</button>`}</div>
 <div class="grid md:grid-cols-2 gap-4"><div class="card space-y-2"><h3 class="font-bold">Bảng tin</h3>
 ${staff?`<form id="af" class="space-y-1"><input name="title" class="i" placeholder="Tiêu đề" required><textarea name="body" class="i" placeholder="Nội dung"></textarea><button class="b">Đăng</button></form>`:''}
 ${an.map(a=>`<div class="border-t pt-1"><b>${esc(a.title)}</b> <span class="text-slate-500">${esc(a.author)} • ${dt(a.created)}</span><p>${esc(a.body)}</p></div>`).join('')||empty('Chưa có thông báo')}</div>
 <div class="card space-y-2"><h3 class="font-bold">Thành viên (${mem.filter(m=>m.status==='ACTIVE').length})</h3>
 ${staff?`<form id="mf" class="flex gap-2"><input name="code" class="i" placeholder="Thêm SV theo MSSV" required><button class="b">Thêm</button></form>`:''}
 ${pend.map(m=>`<div>⏳ ${esc(m.name)} (${esc(m.code)}) <button class="b" onclick="decide(${id},${m.id},'APPROVE')">Duyệt</button> <button class="b b2" onclick="decide(${id},${m.id},'REJECT')">Từ chối</button></div>`).join('')}
 ${mem.filter(m=>m.status==='ACTIVE').map(m=>`<div>${esc(m.name)} <span class="text-slate-500">${esc(m.code)}</span></div>`).join('')||empty('Chưa có thành viên')}</div></div>
 <div class="card space-y-2"><h3 class="font-bold">Bài tập / Thực hành / Kiểm tra</h3>
 ${staff?`<form id="sf" class="grid md:grid-cols-6 gap-2"><input name="title" class="i md:col-span-2" placeholder="Tiêu đề" required><select name="kind" class="i"><option value="ASSIGNMENT">Bài tập</option><option value="LAB">Thực hành</option><option value="QUIZ">Kiểm tra</option></select><input name="due" type="datetime-local" class="i"><input name="max_score" type="number" value="10" class="i"><label><input type="checkbox" name="allow_resubmit" value="1"> Cho nộp lại</label><textarea name="description" class="i md:col-span-5" placeholder="Yêu cầu"></textarea><button class="b">Giao bài</button></form>`:''}
 ${as.map(a=>`<div class="border-t pt-2"><b>${esc(a.title)}</b> <span class="text-slate-500">[${a.kind}] hạn: ${dt(a.due)} • thang ${a.max_score}</span><p>${esc(a.description)}</p>
 ${staff?`<button class="b" onclick="subs(${a.id})">Bài nộp (${a.submitted})</button><div id="s${a.id}"></div>`
 :`<div>Trạng thái: <b>${a.my_status||'Chưa làm'}</b>${a.my_score!=null?` • Điểm: <b>${a.my_score}/${a.max_score}</b> • ${esc(a.my_feedback||'')}`:''}</div>
 <form class="sub space-y-1 mt-1" data-id="${a.id}"><textarea name="content" class="i" placeholder="Nhập bài làm / kết quả tính dung sai…">${esc(a.my_content||'')}</textarea><button class="b b2" name="action" value="draft">Lưu nháp</button> <button class="b" name="action" value="submit">Nộp bài</button></form>`}</div>`).join('')||empty('Chưa có bài nào')}</div>`;
 if($('#af'))$('#af').onsubmit=e=>{e.preventDefault();act(async()=>{await api('POST',`/classes/${id}/announcements`,fd(e.target));render()},'Đã đăng')};
 if($('#mf'))$('#mf').onsubmit=e=>{e.preventDefault();act(async()=>{await api('POST',`/classes/${id}/members`,fd(e.target));render()},'Đã thêm sinh viên')};
 if($('#sf'))$('#sf').onsubmit=e=>{e.preventDefault();act(async()=>{await api('POST',`/classes/${id}/assignments`,fd(e.target));render()},'Đã giao bài')};
 document.querySelectorAll('.sub').forEach(f=>f.onsubmit=e=>{e.preventDefault();const b=e.submitter;act(async()=>{await api('POST',`/assignments/${f.dataset.id}/submit`,{content:f.content.value,action:b.value});render()},b.value==='draft'?'Đã lưu nháp':'Đã nộp bài')})}
const cp=t=>navigator.clipboard.writeText(t).then(()=>toast('Đã sao chép'));
const patch=(id,b)=>act(async()=>{await api('PATCH','/classes/'+id,b);render()},'Đã cập nhật');
const decide=(c,u,d)=>act(async()=>{await api('POST',`/classes/${c}/members/${u}/decision`,{decision:d});render()},'Đã xử lý');
const leave=id=>confirm('Rời lớp này?')&&act(async()=>{await api('POST',`/classes/${id}/leave`);go('classes')},'Đã rời lớp');
async function subs(aid){const l=await act(()=>api('GET',`/assignments/${aid}/submissions`));if(!l)return;
 $('#s'+aid).innerHTML=l.map(s=>`<form class="gr border rounded p-2 my-1 space-y-1" data-id="${s.id}"><b>${esc(s.name)} (${esc(s.code)})</b> • ${s.status} • lần ${s.attempt}<p class="bg-slate-100 p-1">${esc(s.content)}</p>
 <input name="score" type="number" step="0.25" value="${s.score??''}" placeholder="Điểm" class="i" style="width:6rem"> <input name="feedback" value="${esc(s.feedback||'')}" placeholder="Nhận xét" class="i" style="width:60%"> <button class="b" name="op" value="grade">Chấm</button> <button class="b b2" name="op" value="redo">Yêu cầu nộp lại</button> <button type="button" class="b b2" onclick="hist(${s.id})">Lịch sử</button></form>`).join('')||empty('Chưa có bài nộp');
 $('#s'+aid).querySelectorAll('.gr').forEach(f=>f.onsubmit=e=>{e.preventDefault();const redo=e.submitter.value==='redo';act(async()=>{await api('PUT',`/submissions/${f.dataset.id}/grade`,{score:f.score.value,feedback:f.feedback.value,requestResubmit:redo});subs(aid)},'Đã lưu')})}
async function hist(id){const h=await act(()=>api('GET',`/submissions/${id}/history`));if(h)alert('Lịch sử nộp:\n'+h.history.map(x=>`${x.at} ${x.event} ${x.detail||''}`).join('\n')+'\n\nLịch sử chấm:\n'+(h.grades.map(x=>`${x.at}: ${x.old_score??'-'} → ${x.new_score}`).join('\n')||'—'))}
async function notif(){const l=await api('GET','/notifications');await api('POST','/notifications/read');$('#app').innerHTML=`<div class="card"><h3 class="font-bold mb-2">Thông báo</h3>${l.map(n=>`<div class="border-t py-1 ${n.read?'':'font-bold'}">${esc(n.title)} <span class="font-normal text-slate-500">${esc(n.body)} • ${dt(n.at)}</span></div>`).join('')||empty('Chưa có thông báo')}</div>`}
async function admin(){const [u,au,st]=await Promise.all([api('GET','/admin/users'),api('GET','/admin/audit'),api('GET','/admin/stats')]);
 $('#app').innerHTML=`<div class="card">${Object.entries(st).map(([k,v])=>`<span class="mr-4">${k}: <b>${v}</b></span>`).join('')} <button class="b ml-4" onclick="backup()">Sao lưu (JSON)</button></div>
 <form id="uf" class="card grid md:grid-cols-6 gap-2"><input name="code" class="i" placeholder="Mã" required><input name="name" class="i" placeholder="Họ tên" required><input name="email" type="email" class="i" placeholder="Email" required><select name="role" class="i"><option value="STUDENT">SV</option><option value="LECTURER">GV</option><option value="ADMIN">Admin</option></select><input name="password" class="i" value="123456"><button class="b">Thêm</button></form>
 <div class="card overflow-x-auto"><table class="w-full text-left">${u.map(x=>`<tr class="border-t"><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.role}</td><td>${x.locked?'🔒':'✔'}</td><td><button class="b b2" onclick="upd(${x.id},{locked:${!x.locked}})">${x.locked?'Mở khóa':'Khóa'}</button> <button class="b b2" onclick="upd(${x.id},{reset_password:true})">Reset MK</button></td></tr>`).join('')}</table></div>
 <div class="card max-h-72 overflow-auto"><h3 class="font-bold">Nhật ký hệ thống</h3>${au.map(a=>`<div class="text-xs">${a.at} • ${esc(a.code||'-')} • ${a.action} ${esc(a.detail||'')}</div>`).join('')}</div>`;
 $('#uf').onsubmit=e=>{e.preventDefault();act(async()=>{await api('POST','/admin/users',fd(e.target));render()},'Đã thêm')}}
const upd=(id,b)=>act(async()=>{await api('PATCH','/admin/users/'+id,b);render()},'Đã cập nhật');
const backup=()=>act(async()=>{const d=await api('GET','/admin/backup'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='tfit-backup.json';a.click()});
async function boot(){if(!T)return loginView();try{U=await api('GET','/me')}catch{return loginView()}
 const j=new URLSearchParams(location.search).get('join');if(j&&U.role==='STUDENT'){history.replaceState(null,'','lms.html');act(async()=>{const r=await api('POST','/classes/join',{code:j});toast(r.status==='PENDING'?'Đã gửi yêu cầu tham gia':'Tham gia lớp thành công')})}
 V={v:'home'};render()}
boot();
</script></body></html>
