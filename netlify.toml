[build]
  command = "echo static site"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Không công khai mã nguồn server và test
[[redirects]]
  from = "/server/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
